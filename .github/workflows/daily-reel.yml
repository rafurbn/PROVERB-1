name: Daily Bengali Proverb Reel Publisher

on:
  schedule:
    # Runs every day at 09:00 AM Bangladesh Standard Time (03:00 UTC)
    - cron: '37 7 * * *'
  workflow_dispatch:
    inputs:
      proverb_id:
        description: 'Optional specific Proverb ID from Google Sheet (leave blank for next pending)'
        required: false
        default: ''

jobs:
  publish-daily-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install FFmpeg and Bengali Fonts (Noto Sans Bengali)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-core fonts-beng language-pack-bn
          fc-cache -f -v

      - name: Install project dependencies
        run: npm ci

      - name: Generate and publish daily Bengali Proverb Reel
        env:
          GOOGLE_SHEET_API_URL: ${{ secrets.GOOGLE_SHEET_API_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PROVERB_ID: ${{ github.event.inputs.proverb_id }}
        run: npm run daily-reel
